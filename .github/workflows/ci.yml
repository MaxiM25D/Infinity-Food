name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infinityfood_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinityfood_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: error
      METRICS_TOKEN: ci-metrics-token
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infinityfood_test?schema=public
      API_PUBLIC_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      MP_TOKEN_ENCRYPTION_KEY: ci-only-encryption-key-32-characters
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: API tests
        run: pnpm test:api
      - name: Web tests
        run: pnpm --filter @infinityshop/web test
      - name: Tenant isolation tests
        run: pnpm db:test:isolation
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Critical E2E
        run: pnpm test:e2e
        env:
          CI: true

  docker-images:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f Dockerfile.api -t infinityfood-api:ci .
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api -t infinityfood-web:ci .
